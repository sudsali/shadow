# Drop-in caller workflow. Save as `.github/workflows/shadow.yml` in your repo.
# Then add a `.shadow.yml` config file (see examples/shadow.example.yml).
# Then set the `AWS_ROLE_ARN` repository secret. That's the install.

name: Shadow

# Embed the PR/issue number in the run name. The reusable workflow's run-name
# is ignored when invoked via workflow_call — only the caller's template
# applies. This is what lets the rate-limit gate (BOT_MAX_RUNS_PER_HOUR) match
# prior runs for issue/issue_comment events, where the workflow_run record
# has no `pull_requests` array to match on.
run-name: "Shadow #${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}"

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  # Issue review (optional). Shadow handles issues + issue_comment events.
  # Add `issue_comment` if you want followup-reply behavior on existing issues.
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        description: "PR or issue number to review"
      dry_run:
        type: boolean
        default: true
      shadow_ref:
        default: v1.8
        description: "Shadow ref to pin to: a v1.x release tag, or a 40-char commit SHA"

permissions:
  contents: read
  id-token: write
  pull-requests: write
  issues: write

# Kill-switch: set repo or org **variable** SHADOW_DISABLED=true (Settings →
# Secrets and variables → Actions → Variables tab; not the Secrets tab) to
# disable both jobs without deleting this workflow file.
jobs:
  shadow:
    uses: sudsali/shadow/.github/workflows/shadow-review.yml@v1.8
    with:
      pr_number: ${{ inputs.pr_number }}
      dry_run: ${{ inputs.dry_run && 'true' || 'false' }}
      # Keep this in sync with the `uses:` pin above — GitHub forbids
      # expressions in `uses:`, so the two can't share a variable.
      shadow_ref: ${{ inputs.shadow_ref || 'v1.8' }}
      # Cost levers — uncomment to override the defaults (10/8). Lower
      # numbers cap Bedrock spend at the cost of review depth.
      # investigator_max_tool_calls: "5"
      # critic_max_tool_calls: "4"
      # Guardrail gate — defaults to 'true' (production runs refuse to start
      # without GUARDRAIL_ID). Uncomment to run without a guardrail.
      # require_guardrail: "false"
      # Region for all AWS calls (Bedrock, guardrail, prompt secrets). Defaults
      # to us-east-1; set to your CFN BedrockRegion if you deployed elsewhere.
      # aws_region: "us-west-2"
      # Bring-your-own prompts (optional): a Secrets Manager namespace holding
      # all eight prompt secrets — the five PR prompts (/pr-investigator-prompt,
      # /pr-critic-prompt, /pr-reporter-prompt, /pr-investigator-commit-prompt,
      # /pr-critic-commit-prompt) AND the three issue/followup prompts
      # (/issue-classify-prompt, /issue-respond-prompt, /followup-prompt).
      # One prefix customizes the whole bot. Leave unset to use Shadow's bundled
      # defaults. Role needs secretsmanager:GetSecretValue on <prefix>/*-prompt.
      # See README "Bring-your-own prompts".
      # prompt_sm_prefix: "my-bot"
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      # Provisioned by the CFN Launch Stack. Required unless
      # require_guardrail is set to "false" above.
      GUARDRAIL_ID: ${{ secrets.GUARDRAIL_ID }}
      GUARDRAIL_VERSION: ${{ secrets.GUARDRAIL_VERSION }}
      # Optional Bedrock overrides — leave commented to use defaults.
      # BEDROCK_MODEL_ID: ${{ secrets.BEDROCK_MODEL_ID }}
      # BEDROCK_REPORTER_MODEL_ID: ${{ secrets.BEDROCK_REPORTER_MODEL_ID }}
      # BEDROCK_CRITIC_MODEL_ID: ${{ secrets.BEDROCK_CRITIC_MODEL_ID }}
      # Issue/followup answers (defaults to reporter). Must support structured
      # output — Haiku 4.5 or Sonnet 4.6 (not Opus 4.8 / Sonnet 5).
      # BEDROCK_ISSUE_MODEL_ID: ${{ secrets.BEDROCK_ISSUE_MODEL_ID }}
      # KB_S3_BUCKET: ${{ secrets.KB_S3_BUCKET }}
      # KB_S3_KEY: ${{ secrets.KB_S3_KEY }}
      # SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
