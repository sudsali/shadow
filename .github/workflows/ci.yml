name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install runtime + test dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit + integration + contract + replay-bench tests
        run: python -m pytest tests/ -v

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Lint workflow YAML
        # actionlint catches expression typos, missing inputs, perm mismatches.
        run: |
          curl -sLO https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar xzf actionlint_1.7.7_linux_amd64.tar.gz actionlint
          ./actionlint -color
