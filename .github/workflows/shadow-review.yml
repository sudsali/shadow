name: Shadow Review (reusable)
# NB: GitHub ignores `run-name` in workflow_call callees — only the caller's
# template wins. The rate-limit gate's name-needle fallback (used for
# issue_comment events without a pull_requests array) is documented as the
# adopter's responsibility in `examples/caller-workflow.yml`.

# Two-job security split — canonical defense against pull_request_target
# misuse (GitHub Security Lab, Panther T1195.002 Sigma rule):
#   analyze: id-token:write only. Calls Bedrock; cannot post comments.
#   act:     pull-requests:write only. Posts to GitHub; cannot call AWS.

on:
  workflow_call:
    inputs:
      shadow_ref:
        type: string
        default: v1.8
        description: "git ref of sudsali/shadow to clone (tag, branch, or sha)"
      pr_number:
        type: string
        required: false
        description: "Override PR or issue number for workflow_dispatch flows"
      dry_run:
        type: string
        default: "false"
      investigator_max_tool_calls:
        type: string
        default: "10"
        description: "Cost cap. Lowering trades depth for cost (~$2/PR per 5 calls)."
      critic_max_tool_calls:
        type: string
        default: "8"
        description: "Cost cap on the disprove pass."
      require_guardrail:
        type: string
        default: "true"
        description: "Refuse production runs (dry_run=false) without a guardrail. Set 'false' to opt out (custom guardrail, or local-sanitizer-only)."
      aws_region:
        type: string
        default: "us-east-1"
        description: >-
          Region for all AWS calls (Bedrock, the guardrail, and any
          Secrets-Manager-backed prompts). MUST match where you enabled Bedrock
          model access and provisioned the guardrail/prompt secrets. Defaults to
          us-east-1; set to your CFN BedrockRegion (us-west-2 / us-east-2 / ...).
      prompt_sm_prefix:
        type: string
        default: ""
        description: >-
          Optional. Bring-your-own prompts for the WHOLE bot: a Secrets Manager
          namespace (e.g. 'my-bot') holding all eight prompt secrets — the five
          PR-review prompts (<prefix>/pr-investigator-prompt, /pr-critic-prompt,
          /pr-reporter-prompt, /pr-investigator-commit-prompt,
          /pr-critic-commit-prompt) AND the three issue/followup prompts
          (<prefix>/issue-classify-prompt, /issue-respond-prompt,
          /followup-prompt). When set, the engine loads these instead of its
          bundled language-agnostic prompts on every surface. Leave empty to use
          the bundled defaults. The core prompts (investigator/critic/reporter/
          issue-classify/issue-respond/followup) fail closed: a missing or
          unreadable secret ESCALATEs rather than silently running the bundled
          default. The IAM role must allow secretsmanager:GetSecretValue on
          <prefix>/*-prompt.
    secrets:
      AWS_ROLE_ARN:
        required: true
        description: "IAM role ARN with Bedrock invoke permission. Trust policy MUST include this repo via job_workflow_ref claim."
      KB_S3_BUCKET:
        required: false
      KB_S3_KEY:
        required: false
      BEDROCK_MODEL_ID:
        required: false
      BEDROCK_REPORTER_MODEL_ID:
        required: false
      BEDROCK_CRITIC_MODEL_ID:
        required: false
      BEDROCK_ISSUE_MODEL_ID:
        required: false
        description: "Model for issue/followup answers (defaults to the reporter model). Must support structured output over Bedrock (Haiku 4.5 / Sonnet 4.6)."
      GUARDRAIL_ID:
        required: false
      GUARDRAIL_VERSION:
        required: false
      SLACK_WEBHOOK_URL:
        required: false
        description: "Slack webhook URL for escalation notifications. Empty = Slack off."

# Concurrency keyed on the caller's PR or issue number so different items
# run in parallel but same-item events serialize.
concurrency:
  group: shadow-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # observed up to ~7min on slow Bedrock days
    # `vars` (not `secrets`) is the only way to gate a workflow_call job
    # at the job level — `secrets` is not in the allowed `if:` context.
    # Adopters set repo or org variable SHADOW_DISABLED=true.
    if: ${{ vars.SHADOW_DISABLED != 'true' }}
    # Reusable workflows do NOT inherit caller permissions — declare the
    # minimum each job needs. analyze needs pull-requests:read to fetch
    # existing PR review comments (so re-runs don't re-raise addressed
    # issues), and id-token:write to assume the AWS role via OIDC.
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - name: Checkout caller repo (base branch — secure by design)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # No `ref:` here: pull_request_target defaults to base branch HEAD,
          # which is the security-locked path. Reading PR head would expose
          # secrets to attacker code (the "pwn request" pattern).

      - name: Checkout Shadow bot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sudsali/shadow
          ref: ${{ inputs.shadow_ref }}
          # Distinct path so an adopter repo with `.shadow-bot/` already
          # committed doesn't collide (checkout v4 fails on non-empty path).
          path: shadow-bot-runtime
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r shadow-bot-runtime/requirements.txt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: shadow-${{ github.run_id }}-${{ github.run_attempt }}
          # v5 exports AWS_REGION/AWS_DEFAULT_REGION into the job env, so the
          # engine's Bedrock + Secrets Manager clients inherit this region. Must
          # match the CFN BedrockRegion where model access + secrets live.
          aws-region: ${{ inputs.aws_region }}

      - name: Run analysis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          EVENT_TYPE: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.pull_request.head.sha || github.event.after }}
          KB_S3_BUCKET: ${{ secrets.KB_S3_BUCKET }}
          KB_S3_KEY: ${{ secrets.KB_S3_KEY }}
          BEDROCK_MODEL_ID: ${{ secrets.BEDROCK_MODEL_ID || 'us.anthropic.claude-opus-4-8' }}
          BEDROCK_REPORTER_MODEL_ID: ${{ secrets.BEDROCK_REPORTER_MODEL_ID || 'us.anthropic.claude-haiku-4-5-20251001-v1:0' }}
          BEDROCK_CRITIC_MODEL_ID: ${{ secrets.BEDROCK_CRITIC_MODEL_ID }}
          BEDROCK_ISSUE_MODEL_ID: ${{ secrets.BEDROCK_ISSUE_MODEL_ID }}
          GUARDRAIL_ID: ${{ secrets.GUARDRAIL_ID }}
          GUARDRAIL_VERSION: ${{ secrets.GUARDRAIL_VERSION }}
          BOT_AGENT_PIPELINE: "1"
          BOT_INVESTIGATOR_MAX_TOOL_CALLS: ${{ inputs.investigator_max_tool_calls }}
          BOT_CRITIC_MAX_TOOL_CALLS: ${{ inputs.critic_max_tool_calls }}
          BOT_REQUIRE_GUARDRAIL: ${{ inputs.require_guardrail }}
          # Bring-your-own prompts (opt-in): each SM_*_PROMPT names a Secrets
          # Manager secret the engine fetches in place of its bundled default.
          # The guard yields '' when the prefix is unset (empty = use bundled).
          # All EIGHT prompts the bot loads are wired here, not just the PR
          # ones — so a single prompt_sm_prefix customizes PR review, issue
          # triage, issue-respond, and followup uniformly.
          SM_PR_INVESTIGATOR_PROMPT: ${{ inputs.prompt_sm_prefix && format('{0}/pr-investigator-prompt', inputs.prompt_sm_prefix) || '' }}
          SM_PR_CRITIC_PROMPT: ${{ inputs.prompt_sm_prefix && format('{0}/pr-critic-prompt', inputs.prompt_sm_prefix) || '' }}
          SM_PR_REPORTER_PROMPT: ${{ inputs.prompt_sm_prefix && format('{0}/pr-reporter-prompt', inputs.prompt_sm_prefix) || '' }}
          SM_PR_INVESTIGATOR_COMMIT_PROMPT: ${{ inputs.prompt_sm_prefix && format('{0}/pr-investigator-commit-prompt', inputs.prompt_sm_prefix) || '' }}
          SM_PR_CRITIC_COMMIT_PROMPT: ${{ inputs.prompt_sm_prefix && format('{0}/pr-critic-commit-prompt', inputs.prompt_sm_prefix) || '' }}
          SM_ISSUE_CLASSIFY_PROMPT: ${{ inputs.prompt_sm_prefix && format('{0}/issue-classify-prompt', inputs.prompt_sm_prefix) || '' }}
          SM_ISSUE_RESPOND_PROMPT: ${{ inputs.prompt_sm_prefix && format('{0}/issue-respond-prompt', inputs.prompt_sm_prefix) || '' }}
          SM_FOLLOWUP_PROMPT: ${{ inputs.prompt_sm_prefix && format('{0}/followup-prompt', inputs.prompt_sm_prefix) || '' }}
          DRY_RUN: ${{ inputs.dry_run }}
          ARTIFACT_PATH: ${{ runner.temp }}/shadow_result.json
          # Audit anchor — what shadow_ref this run pinned. GITHUB_SHA is the
          # adopter's PR commit, not Shadow's. The provenance block reads this.
          SHADOW_BOT_REF: ${{ inputs.shadow_ref }}
          # Tell the bot where the adopter repo's checkout is so .shadow.yml
          # resolves correctly (the repo we're reviewing, not the bot itself).
          SHADOW_REPO_ROOT: ${{ github.workspace }}
        run: |
          cd shadow-bot-runtime
          PYTHONPATH=src/scripts python -m shadow.main analyze
        working-directory: ${{ github.workspace }}

      - name: Upload analyze artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shadow-result
          path: ${{ runner.temp }}/shadow_result.json
          retention-days: 7

  act:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: analyze
    if: ${{ vars.SHADOW_DISABLED != 'true' }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout caller repo (for .shadow.yml — bot_name etc.)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Checkout Shadow bot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sudsali/shadow
          ref: ${{ inputs.shadow_ref }}
          path: shadow-bot-runtime
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r shadow-bot-runtime/requirements.txt

      - name: Download analyze artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: shadow-result
          path: ${{ runner.temp }}

      - name: Execute actions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          EVENT_TYPE: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          DRY_RUN: ${{ inputs.dry_run }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ARTIFACT_PATH: ${{ runner.temp }}/shadow_result.json
          # act() also reads .shadow.yml for bot_name etc.
          SHADOW_REPO_ROOT: ${{ github.workspace }}
          # Config()'s guardrail gate runs in both jobs; act() needs the
          # same guardrail env as analyze() or the gate exits 1.
          GUARDRAIL_ID: ${{ secrets.GUARDRAIL_ID }}
          GUARDRAIL_VERSION: ${{ secrets.GUARDRAIL_VERSION }}
          BOT_REQUIRE_GUARDRAIL: ${{ inputs.require_guardrail }}
        run: |
          cd shadow-bot-runtime
          PYTHONPATH=src/scripts python -m shadow.main act
